seed: 42

languages:
  - english
  - portuguese

seed_datasets:
  toxigen:
    dataset_id: toxigen
    subset: train
    split: train
    path: toxigen/toxigen-data
    language: english
    sample_id_column: null
    text_column: generation
    group_column: group
    harmful_column_label: prompt_label
    is_harmful_label_value: 1
    samples_per_minority: 2

  toxsyn:
    dataset_id: toxsyn
    subset: null
    split: train
    path: ToxSyn/ToxSyn-PT
    language: portuguese
    sample_id_column: id
    text_column: text
    group_column: group
    harmful_column_label: is_toxic
    is_harmful_label_value: 1
    samples_per_minority: 2


paths:
  hf_cache: cache/huggingface
  
  seed_dataset: datasets/seed_dataset
  scenarios: datasets/scenarios
  mijabench: datasets/mijabench
  mijabench_align: datasets/mijabench_align

  scenarios_yaml: configs/scenario_categories.yaml
  prompts_yaml: configs/prompts.yaml
  jailbreak_strategies_yaml: configs/jailbreak_strategies.yaml


scenarios:
  num_scenarios_per_category: 2


mijabench:
  model_name: Qwen/Qwen3-235B-A22B-Instruct-2507-FP8
  api_url: http://localhost:8010/v1
  api_key: EMPTY
  max_tokens: 4096
  batch_size: 2048
  num_shots: 2
  temperature: 0.7
  top_p: 0.9
  top_k: 20